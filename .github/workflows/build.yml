name: Build Android App
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev python3-dev build-essential ccache git unzip zlib1g-dev zip openjdk-17-jdk-headless
          pip install --upgrade pip
          pip install buildozer cython

      - name: Create Buildozer Spec
        run: |
          buildozer init
          sed -i 's/title = My Application/title = SandraApp/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==master,kivymd,plyer/g' buildozer.spec
          sed -i 's/# android.permissions =/android.permissions = android.permission.VIBRATE, android.permission.WAKE_LOCK, android.permission.RECEIVE_BOOT_COMPLETED, android.permission.SET_ALARM/g' buildozer.spec
          sed -i 's/p4a.branch = stable/p4a.branch = master/g' buildozer.spec

      - name: Build with Buildozer
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk

